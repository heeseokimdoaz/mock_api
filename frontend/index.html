<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapaCross 프로토타입</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>TapaCross 언론 모니터링</h1>
        <p class="subtitle">프로토타입 (Mock API 기반)</p>
    </header>

    <section id="controls">
        <div class="control-group">
            <label>시작일
                <input type="date" id="fromDate" value="2026-02-08">
            </label>
            <label>종료일
                <input type="date" id="toDate" value="2026-02-12">
            </label>
            <label>매체
                <select id="siteType">
                    <option value="">전체</option>
                    <option value="media">매스미디어</option>
                    <option value="comm">커뮤니티</option>
                    <option value="twitter">X(트위터)</option>
                    <option value="youtube">유튜브</option>
                </select>
            </label>
            <button id="searchBtn" onclick="loadData()">조회</button>
        </div>
    </section>

    <section id="trend-section">
        <h2>언급량 추이</h2>
        <div class="chart-container">
            <canvas id="trendChart"></canvas>
        </div>
    </section>

    <section id="doc-section">
        <h2>원문 목록 <span id="docCount" class="count-badge"></span></h2>
        <table id="docTable">
            <thead>
                <tr>
                    <th>작성일</th>
                    <th>매체</th>
                    <th>사이트</th>
                    <th>제목 / 내용</th>
                    <th>긍부정</th>
                    <th>링크</th>
                </tr>
            </thead>
            <tbody id="docBody"></tbody>
        </table>
        <div id="pagination">
            <button onclick="prevPage()">이전</button>
            <span id="pageInfo">1</span>
            <button onclick="nextPage()">다음</button>
        </div>
    </section>

    <script src="/js/app.js"></script>
</body>
</html>
